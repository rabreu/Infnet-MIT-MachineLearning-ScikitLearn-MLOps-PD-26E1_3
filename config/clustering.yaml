geo_kmeans:
  features: ["order_estimated_delivery_date", "order_delivered_customer_date"]
  n_clusters_range: [3, 4, 5, 6, 8, 10]
  optimal_metric: "silhouette"
  figure_dpi: 120

full_kmeans:
  features: ["order_estimated_delivery_date", "order_delivered_customer_date"]
  n_clusters_range: [3, 4, 5, 6, 8]
  metric: "silhouette"
  dpi: 120

dbscan:
  eps_range: [0.5, 1.0, 1.5]
  min_samples: 100
  features: ["order_estimated_delivery_date", "order_delivered_customer_date"]
  figure_dpi: 120
  geo_map:
    alpha: 0.4